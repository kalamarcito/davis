# Project name MUST match the Komodo stack name ("davis"). If this differs
# from what Komodo uses (directory/stack-derived name), you get TWO stacks
# (e.g. davis-docker-* and davis-*) fighting over host port 9000.
# Do NOT set container_name: below — global fixed names survive a partial
# "down" and then block the next "up". Service DNS (mysql / davis) still
# works on the compose network without container_name.
name: "davis"

services:

  nginx:
    image: nginx:1.25-alpine
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    depends_on:
      - davis
    volumes:
      - davis_www:/var/www/davis
      - type: bind
        source: ./configurations/nginx.conf
        target: /etc/nginx/conf.d/default.conf
    ports:
      - 9000:80
    restart: unless-stopped

  mysql:
    image: mariadb:10.11
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - database:/var/lib/mysql
    restart: unless-stopped

  davis:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
      args:
        fpm_user: 101:101
    # Fully-qualified local name so podman builds and runs the *same* image:
    # a short name like "davis:latest" is normalized to docker.io/library/davis
    # on build but may resolve to localhost/davis on run, leaving a stale image
    # running. (On plain Docker this can be simplified back to "davis:latest".)
    image: localhost/davis:latest
    # If you want to use a prebuilt image from Github
    # image: ghcr.io/tchapi/davis:edge
    env_file: .env
    environment:
      - DATABASE_DRIVER=mysql
      - DATABASE_URL=mysql://${DB_USER}:${DB_PASSWORD}@mysql:3306/${DB_DATABASE}?serverVersion=mariadb-10.6.10&charset=utf8mb4
      - MAILER_DSN=smtp://${MAIL_USERNAME}:${MAIL_PASSWORD}@${MAIL_HOST}:${MAIL_PORT}
    depends_on:
      - mysql
    volumes:
      - davis_www:/var/www/davis
    restart: unless-stopped

volumes:
  # Fixed + external: compose reuses the existing named volumes regardless of
  # project renames (davis vs davis-docker). Create once if missing:
  #   podman volume create davis_www && podman volume create database
  davis_www:
    name: davis_www
    external: true
  database:
    name: database
    external: true
